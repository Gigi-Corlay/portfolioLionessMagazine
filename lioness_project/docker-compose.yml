services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Les images envoyées depuis l'administration restent sur le VPS,
      # dans un dossier lisible par Nginx et indépendant du conteneur.
      - /var/www/lioness-media:/app/media

volumes:
  postgres_data:
